<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hashivilla Sreemangal - Room Allocation</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f5ef] text-gray-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Hashivilla Sreemangal</h1>
      <p class="text-gray-600 mt-1">Room allocation by floor — <span class="font-semibold text-gray-700">23 of 30 IDs collected</span></p>
    </header>

    <!-- 2nd Floor -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">2nd floor</h2>
      <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4" id="floor-2">
        <!-- Rooms generated by JS -->
      </div>
    </section>

    <!-- 4th Floor -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">4th floor</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-7 gap-3" id="floor-4">
        <!-- Rooms generated by JS -->
      </div>
    </section>
  </div>

  <!-- Guest List Modal -->
  <div id="roomModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative animate-fade-in">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      <h3 id="modalRoomTitle" class="text-2xl font-bold text-gray-800 mb-4"></h3>
      <div id="modalGuestList" class="space-y-2">
        <!-- Guest Details -->
      </div>
    </div>
  </div>

  <script>
    const roomData = [
      // 2nd Floor
      { floor: 2, room: "206", verified: true, guests: [ { name: "Sumi khala", present: true }, { name: "khalu", present: true } ] },
      { floor: 2, room: "207", verified: false, guests: [ { name: "choto mami", present: false }, { name: "jumaina", present: true }, { name: "chandan mama", present: false } ] },
      { floor: 2, room: "209", verified: true, guests: [ { name: "Ammu", present: true }, { name: "khalamoni", present: true }, { name: "Ammar", present: true } ] },
      { floor: 2, room: "204", verified: true, guests: [ { name: "Abbu", present: true }, { name: "Noor Mohammad", present: true }, { name: "Mejo mama", present: true } ] },

      // 4th Floor
      { floor: 4, room: "401", verified: false, guests: [ { name: "usamah", present: true }, { name: "sohan", present: true }, { name: "choto mama", present: false } ] },
      { floor: 4, room: "405", verified: true, guests: [ { name: "dipok", present: true }, { name: "sneha", present: true } ] },
      { floor: 4, room: "406", verified: true, guests: [ { name: "risad", present: true }, { name: "moumi", present: true } ] },
      { floor: 4, room: "404", verified: false, guests: [ { name: "ramisha", present: true }, { name: "zoon", present: true }, { name: "nusaiba", present: false } ] },
      { floor: 4, room: "407", verified: false, guests: [ { name: "Nan", present: true }, { name: "bulu nani", present: false }, { name: "subaita", present: true } ] },
      { floor: 4, room: "409", verified: true, guests: [ { name: "Mejo mami", present: true }, { name: "ariba", present: true }, { name: "arisha", present: true } ] },
      { floor: 4, room: "402", verified: false, guests: [ { name: "rajib mama", present: false }, { name: "faiyad", present: false }, { name: "munna bhai", present: true } ] }
    ];

    function renderRooms() {
      const f2 = document.getElementById('floor-2');
      const f4 = document.getElementById('floor-4');

      roomData.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between";
        card.onclick = () => showRoomDetails(item);

        const checkMark = item.verified ? '<span class="text-gray-400 text-sm">✓</span>' : '';
        
        card.innerHTML = `
          <div class="flex items-center gap-1 mb-2">
            <span class="font-bold text-lg text-gray-800">Room ${item.room}</span>
            ${checkMark}
          </div>
          <div class="text-sm text-gray-600">
            ${item.guests.map(g => `
              <div class="flex items-center gap-1">
                <span class="${g.present ? 'text-green-600' : 'text-red-400'}">${g.present ? '✓' : '✕'}</span>
                <span>${g.name}</span>
              </div>
            `).join('')}
          </div>
        `;

        if (item.floor === 2) f2.appendChild(card);
        else if (item.floor === 4) f4.appendChild(card);
      });
    }

    function showRoomDetails(item) {
      document.getElementById('modalRoomTitle').innerText = `Room ${item.room} (${item.floor}th Floor)`;
      const list = document.getElementById('modalGuestList');
      list.innerHTML = item.guests.map(g => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-gray-50">
          <span class="font-medium text-gray-700">${g.name}</span>
          <span class="font-bold ${g.present ? 'text-green-600' : 'text-red-500'}">
            ${g.present ? '✓ অবস্থান করছেন' : '✕ অনুপস্থিত'}
          </span>
        </div>
      `).join('');
      
      document.getElementById('roomModal').classList.remove('hidden');
      document.getElementById('roomModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('roomModal').classList.add('hidden');
      document.getElementById('roomModal').classList.remove('flex');
    }

    renderRooms();
  </script>
</body>
</html>
